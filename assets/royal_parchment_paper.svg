<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="30%" stop-color="#FDF6C7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#A67C1E" />
    </linearGradient>

    <!-- Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="50%" stop-color="#B22222" />
      <stop offset="100%" stop-color="#5C061B" />
    </linearGradient>

    <!-- Parchment Paper Background Gradient -->
    <radialGradient id="paperGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="70%" stop-color="#FDF5E6" />
      <stop offset="100%" stop-color="#F4E8D3" />
    </radialGradient>

    <!-- Horizontal Border Pattern (Traditional Floral Vine) -->
    <pattern id="borderHoriz" width="60" height="24" patternUnits="userSpaceOnUse">
      <!-- Golden Vine Wave -->
      <path d="M 0,12 Q 15,2 30,12 T 60,12" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <!-- Paisley Leaves -->
      <path d="M 12,8 C 15,3 22,5 18,10 C 15,12 13,10 12,8 Z" fill="url(#goldGrad)"/>
      <path d="M 42,16 C 45,21 52,19 48,14 C 45,12 43,14 42,16 Z" fill="url(#goldGrad)"/>
      <!-- Red Lotus Flowers -->
      <path d="M 27,12 C 27,7 33,7 33,12 Z" fill="url(#redGrad)"/>
      <path d="M 25,12 C 23,9 29,7 27,12 Z" fill="url(#redGrad)"/>
      <path d="M 35,12 C 37,9 31,7 33,12 Z" fill="url(#redGrad)"/>
      <circle cx="30" cy="13" r="1.5" fill="url(#goldGrad)"/>
    </pattern>

    <!-- Vertical Border Pattern (Rotated Vine) -->
    <pattern id="borderVert" width="24" height="60" patternUnits="userSpaceOnUse">
      <path d="M 12,0 Q 2,15 12,30 T 12,60" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <path d="M 8,12 C 3,15 5,22 10,18 C 12,15 10,13 8,12 Z" fill="url(#goldGrad)"/>
      <path d="M 16,42 C 21,45 19,52 14,48 C 12,45 14,43 16,42 Z" fill="url(#goldGrad)"/>
      <path d="M 12,27 C 7,27 7,33 12,33 Z" fill="url(#redGrad)"/>
      <path d="M 12,25 C 9,23 7,29 12,27 Z" fill="url(#redGrad)"/>
      <path d="M 12,35 C 9,37 7,31 12,33 Z" fill="url(#redGrad)"/>
      <circle cx="13" cy="30" r="1.5" fill="url(#goldGrad)"/>
    </pattern>

    <!-- Corner Ornate Lotus Motif -->
    <g id="traditionalCorner">
      <path d="M 0,0 L 50,0 C 50,25 25,50 0,50 Z" fill="url(#goldGrad)" opacity="0.15"/>
      <path d="M 0,40 C 20,40 40,20 40,0" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <path d="M 0,46 C 23,46 46,23 46,0" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
      <g transform="translate(18, 18) scale(0.8)">
        <path d="M 0,0 C -10,-15 10,-15 0,0 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/>
        <path d="M -5,-3 C -15,-18 -2,-18 -5,-3 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/>
        <path d="M 5,-3 C 15,-18 2,-18 5,-3 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/>
        <path d="M -10,-5 C -25,-12 -12,-5 -10,-5 Z" fill="url(#redGrad)"/>
        <path d="M 10,-5 C 25,-12 12,-5 10,-5 Z" fill="url(#redGrad)"/>
        <circle cx="0" cy="-2" r="3" fill="url(#goldGrad)"/>
      </g>
    </g>
  </defs>

  <!-- Parchment Sheet Base -->
  <rect x="0" y="0" width="800" height="800" fill="url(#paperGrad)" />

  <!-- Outer dash lace -->
  <rect x="6" y="6" width="788" height="788" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Repeating Floral Vine Borders -->
  <!-- Top Border -->
  <rect x="40" y="16" width="720" height="24" fill="url(#borderHoriz)"/>
  <!-- Bottom Border -->
  <rect x="40" y="760" width="720" height="24" fill="url(#borderHoriz)"/>
  <!-- Left Border -->
  <rect x="16" y="40" width="24" height="720" fill="url(#borderVert)"/>
  <!-- Right Border -->
  <rect x="760" y="40" width="24" height="720" fill="url(#borderVert)"/>

  <!-- Border separator lines -->
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <rect x="16" y="16" width="768" height="768" fill="none" stroke="url(#redGrad)" stroke-width="1.5"/>

  <!-- Corner Lotus Motifs -->
  <use href="#traditionalCorner" x="16" y="16"/>
  <use href="#traditionalCorner" x="784" y="16" transform="scale(-1, 1) translate(-800, 0)"/>
  <use href="#traditionalCorner" x="16" y="784" transform="scale(1, -1) translate(0, -800)"/>
  <use href="#traditionalCorner" x="784" y="784" transform="scale(-1, -1) translate(-800, -800)"/>
</svg>
