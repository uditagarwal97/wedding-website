<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="30%" stop-color="#FDF6C7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#A67C1E" />
    </linearGradient>

    <!-- Peacock Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005B94" />
      <stop offset="50%" stop-color="#008B8B" />
      <stop offset="100%" stop-color="#004B49" />
    </linearGradient>

    <!-- Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B2F" />
      <stop offset="100%" stop-color="#5C061B" />
    </linearGradient>

    <!-- Parchment Paper Background Gradient -->
    <radialGradient id="paperGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="70%" stop-color="#FDF5E6" />
      <stop offset="100%" stop-color="#F4E8D3" />
    </radialGradient>

    <!-- Traditional Peacock Motif Definition -->
    <g id="peacockMotif">
      <!-- Body & Neck -->
      <path d="M 0,0 Q -10,-15 -5,-25 Q 0,-30 5,-28 Q 10,-20 5,-10 Q 0,0 -10,12" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/>
      <path d="M -5,-25 C -5,-20 0,-15 5,-20" fill="none" stroke="url(#goldGrad)" stroke-width="0.5"/>
      <!-- Head and Crown (Kalgi) -->
      <circle cx="5" cy="-28" r="2.5" fill="url(#blueGrad)"/>
      <path d="M 5,-30.5 L 4,-34 M 5,-30.5 L 6,-35 M 5,-30.5 L 8,-33" stroke="url(#goldGrad)" stroke-width="0.75"/>
      <circle cx="4" cy="-34" r="0.8" fill="url(#redGrad)"/>
      <circle cx="6" cy="-35" r="0.8" fill="url(#redGrad)"/>
      <circle cx="8" cy="-33" r="0.8" fill="url(#redGrad)"/>
      <!-- Beak -->
      <path d="M 7.5,-28 L 12,-27 L 7.5,-26 Z" fill="url(#goldGrad)"/>
      <!-- Eye -->
      <circle cx="4" cy="-28" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-28" r="0.25" fill="#000"/>
      <!-- Wing -->
      <path d="M -2,-8 Q 8,-12 12,0 Q 8,10 -2,-2 Z" fill="url(#goldGrad)" stroke="url(#redGrad)" stroke-width="0.5"/>
      <path d="M 2,-5 Q 8,-8 10,0 Q 8,5 2,-2 Z" fill="url(#redGrad)"/>
      <!-- Crest Feathers -->
      <path d="M -10,0 C -25,5 -30,20 -15,25 C -5,25 -2,15 -10,0" fill="url(#goldGrad)" opacity="0.8"/>
      <path d="M -12,4 C -22,8 -26,18 -14,21 C -6,21 -4,14 -12,4" fill="url(#blueGrad)"/>
    </g>
  </defs>

  <!-- Parchment Sheet Base -->
  <rect x="0" y="0" width="800" height="600" fill="url(#paperGrad)" />

  <!-- Outer Fine Gold Line -->
  <rect x="10" y="10" width="780" height="580" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Red Border Frame -->
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="url(#redGrad)" stroke-width="3" />

  <!-- Inner Gold Frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />

  <!-- Top Ornate Peacock Border Band -->
  <g transform="translate(0, 0)">
    <!-- Ornate gold background bar behind peacocks -->
    <rect x="25" y="25" width="750" height="65" fill="url(#goldGrad)" opacity="0.08" />
    <line x1="25" y1="90" x2="775" y2="90" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Facing Peacocks Motif in Center -->
    <use href="#peacockMotif" x="375" y="65" transform="scale(-1, 1) translate(-750, 0)"/>
    <use href="#peacockMotif" x="425" y="65" />
    
    <!-- Floral vines surrounding the peacocks -->
    <path d="M 25,60 Q 100,45 200,60 T 350,60" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 775,60 Q 700,45 600,60 T 450,60" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Tiny flowers on vines -->
    <circle cx="100" cy="53" r="2.5" fill="url(#redGrad)"/>
    <circle cx="200" cy="60" r="2.5" fill="url(#redGrad)"/>
    <circle cx="600" cy="60" r="2.5" fill="url(#redGrad)"/>
    <circle cx="700" cy="53" r="2.5" fill="url(#redGrad)"/>
  </g>

  <!-- Bottom Ornate Peacock Border Band -->
  <g transform="translate(0, 485)">
    <rect x="25" y="0" width="750" height="65" fill="url(#goldGrad)" opacity="0.08" />
    <line x1="25" y1="0" x2="775" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Facing Peacocks Motif in Center -->
    <use href="#peacockMotif" x="375" y="25" transform="scale(-1, -1) translate(-750, -50)"/>
    <use href="#peacockMotif" x="425" y="25" transform="scale(1, -1) translate(0, -50)"/>
    
    <path d="M 25,30 Q 100,15 200,30 T 350,30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 775,30 Q 700,15 600,30 T 450,30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="100" cy="23" r="2.5" fill="url(#redGrad)"/>
    <circle cx="200" cy="30" r="2.5" fill="url(#redGrad)"/>
    <circle cx="600" cy="30" r="2.5" fill="url(#redGrad)"/>
    <circle cx="700" cy="23" r="2.5" fill="url(#redGrad)"/>
  </g>
</svg>
